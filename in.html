<!-- قسم الاتصال -->
<section class="page-section" id="contact" style="background-color: #acabab; padding-top: 80px; padding-bottom: 60px;">
    <div class="container px-4 px-lg-5">
        <div class="row gx-4 gx-lg-5 justify-content-center">
            <div class="col-lg-8 col-xl-6 text-center">
                <h2 class="mt-0">Bize Ulaşın!</h2>
                <hr class="divider" />
                <p class="text-muted mb-5">Yeni bir web tasarım projeniz mi var? Hemen bizimle iletişime geçin ve projelerinizi hayata geçirelim!</p>
            </div>
        </div>
        <div class="row gx-4 gx-lg-5 justify-content-center mb-5">
            <div class="col-lg-6">
                <form id="contactForm" data-sb-form-api-token="API_TOKEN">
                    <div class="form-floating mb-3">
                        <input class="form-control" id="name" type="text" placeholder="Adınızı Girin..." data-sb-validations="required" />
                        <label for="name">Ad Soyad</label>
                        <div class="invalid-feedback" data-sb-feedback="name:required"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="email" type="email" placeholder="name@example.com" data-sb-validations="required,email" />
                        <label for="email">E-posta Adresi</label>
                        <div class="invalid-feedback" data-sb-feedback="email:required"></div>
                        <div class="invalid-feedback" data-sb-feedback="email:email"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <input class="form-control" id="phone" type="tel" placeholder="(123) 456-7890" data-sb-validations="required" />
                        <label for="phone">Telefon Numarası</label>
                        <div class="invalid-feedback" data-sb-feedback="phone:required"></div>
                    </div>
                    <div class="form-floating mb-3">
                        <textarea class="form-control" id="message" type="text" placeholder="Mesajınızı Buraya Yazın..." style="height: 10rem" data-sb-validations="required"></textarea>
                        <label for="message">Mesaj</label>
                        <div class="invalid-feedback" data-sb-feedback="message:required"></div>
                    </div>
                    <div class="d-none" id="submitSuccessMessage">
                        <div class="text-center mb-3">
                            <div class="fw-bolder"></div>
                        </div>
                    </div>
                    <div class="d-none" id="submitErrorMessage">
                        <div class="text-center text-danger mb-3"></div>
                    </div>
                    <div class="d-grid">
                        <button class="btn btn-primary btn-xl" id="submitButton" type="submit">Gönder</button>
                    </div>
                </form>
            </div>
        </div>
       
    </div>
</section>
